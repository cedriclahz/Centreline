<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E4E6DF">
<title>Centreline</title>
<style>
/* ============================================================
   CENTRELINE — yardage-book instrument
   Paper stock, hard rules, spot red/blue, mono data.
   ============================================================ */
:root{
  --paper:#E4E6DF;
  --paper-2:#EDEEE8;
  --ink:#16181A;
  --ink-2:#5A5F58;
  --rule:#B9BCB2;
  --turf:#C6CDBC;
  --red:#C8352A;
  --blue:#2E5C8A;
  --mono: ui-monospace, "SF Mono", "Roboto Mono", "DejaVu Sans Mono", monospace;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--paper); color:var(--ink); font-family:var(--sans);
  font-size:16px; line-height:1.45;
  padding:0 0 96px; max-width:640px; margin:0 auto;
  padding-left:max(12px, env(safe-area-inset-left));
  padding-right:max(12px, env(safe-area-inset-right));
}
button,input,select,textarea{font:inherit; color:inherit}

/* --- masthead ------------------------------------------------ */
.mast{
  display:flex; align-items:baseline; gap:10px;
  border-bottom:3px solid var(--ink); padding:14px 0 6px; margin-bottom:14px;
  position:sticky; top:0; background:var(--paper); z-index:20;
}
.mast h1{
  font-family:var(--mono); font-size:15px; font-weight:700;
  letter-spacing:.28em; text-transform:uppercase; margin:0;
}
.mast .sub{
  font-family:var(--mono); font-size:10px; letter-spacing:.16em;
  text-transform:uppercase; color:var(--ink-2); margin-left:auto; text-align:right;
}

/* --- section headers ---------------------------------------- */
.eyebrow{
  font-family:var(--mono); font-size:10px; letter-spacing:.2em; text-transform:uppercase;
  color:var(--ink-2); border-bottom:1px solid var(--rule);
  padding-bottom:4px; margin:22px 0 10px; display:flex; gap:8px; align-items:center;
}
.eyebrow b{color:var(--ink); font-weight:700}
.eyebrow .fill{margin-left:auto; font-weight:400}

/* --- blocks -------------------------------------------------- */
.block{border:1px solid var(--rule); background:var(--paper-2); padding:12px; margin-bottom:10px}
.block.flush{padding:0}
.note{font-size:12.5px; color:var(--ink-2); line-height:1.5}

/* --- buttons ------------------------------------------------- */
.btn{
  display:block; width:100%; min-height:52px; padding:12px 14px;
  background:var(--paper-2); border:1.5px solid var(--ink); border-radius:2px;
  font-family:var(--mono); font-size:13px; letter-spacing:.1em; text-transform:uppercase;
  text-align:left; cursor:pointer; margin-bottom:8px;
}
.btn:active{background:var(--turf)}
.btn.solid{background:var(--ink); color:var(--paper)}
.btn.solid:active{background:#000}
.btn.ghost{border-color:var(--rule); font-size:12px; min-height:44px}
.btn.danger{border-color:var(--red); color:var(--red)}
.btn .rt{float:right; opacity:.6}
.row{display:flex; gap:8px}
.row>.btn{margin-bottom:8px}

/* --- chips (club / option pickers) --------------------------- */
.chips{display:flex; flex-wrap:wrap; gap:6px; margin:8px 0}
.chip{
  flex:0 0 auto; min-height:44px; padding:8px 12px;
  border:1px solid var(--rule); background:var(--paper); border-radius:2px;
  font-family:var(--mono); font-size:13px; cursor:pointer;
}
.chip[aria-pressed="true"]{background:var(--ink); color:var(--paper); border-color:var(--ink)}
.chips.grid{display:grid; grid-template-columns:repeat(3,1fr)}
.chips.grid .chip{text-align:center; padding:8px 4px; font-size:12.5px}
.chips.two{display:grid; grid-template-columns:repeat(2,1fr)}
.chips.four{display:grid; grid-template-columns:repeat(4,1fr)}
.chips.four .chip{text-align:center; padding:8px 2px; font-size:12px}

/* --- field / label ------------------------------------------- */
.lbl{
  font-family:var(--mono); font-size:10px; letter-spacing:.18em;
  text-transform:uppercase; color:var(--ink-2); display:block; margin:12px 0 4px;
}
.lbl:first-child{margin-top:0}
input[type=text],input[type=number]{
  width:100%; min-height:48px; padding:10px 12px;
  border:1px solid var(--ink); background:var(--paper); border-radius:2px;
  font-family:var(--mono); font-size:16px;
}
textarea{
  width:100%; min-height:60px; padding:10px 12px; border:1px solid var(--rule);
  background:var(--paper); border-radius:2px; font-family:var(--sans); font-size:14px; resize:vertical;
}

/* --- stepper ------------------------------------------------- */
.step{display:flex; align-items:center; gap:0; border:1px solid var(--ink); border-radius:2px; overflow:hidden}
.step button{width:52px; min-height:48px; background:var(--paper-2); border:0; border-right:1px solid var(--rule); font-size:20px; font-family:var(--mono); cursor:pointer}
.step button:last-child{border-right:0; border-left:1px solid var(--rule)}
.step span{flex:1; text-align:center; font-family:var(--mono); font-size:17px; font-weight:700}

/* --- hole header --------------------------------------------- */
.holehead{
  display:grid; grid-template-columns:auto 1fr auto; gap:12px; align-items:center;
  border-top:3px solid var(--ink); border-bottom:1px solid var(--ink);
  padding:10px 0; margin-bottom:6px;
}
.holenum{font-family:var(--mono); font-size:40px; font-weight:700; line-height:.9; letter-spacing:-.02em}
.holemeta{font-family:var(--mono); font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-2)}
.holemeta b{color:var(--ink)}
.holescore{text-align:right; font-family:var(--mono)}
.holescore .n{font-size:30px; font-weight:700; line-height:1}
.holescore .k{font-size:9px; letter-spacing:.2em; text-transform:uppercase; color:var(--ink-2)}

/* --- shot rows + SIGNATURE deviation strip ------------------- */
.shot{border-bottom:1px solid var(--rule); padding:10px 12px}
.shot:last-child{border-bottom:0}
.shot-top{display:flex; align-items:baseline; gap:8px; font-family:var(--mono); font-size:13px}
.shot-seq{width:22px; color:var(--ink-2); font-size:11px}
.shot-club{font-weight:700; flex:1}
.shot-tag{font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-2)}
.shot-acc{font-size:10px; color:var(--ink-2)}

/* the instrument */
.gauge{margin-top:8px; position:relative; height:26px}
.gauge .track{position:absolute; top:12px; left:0; right:0; height:1px; background:var(--rule)}
.gauge .zero{position:absolute; top:4px; left:50%; width:1.5px; height:17px; background:var(--ink); transform:translateX(-50%)}
.gauge .tick{position:absolute; top:9px; width:1px; height:7px; background:var(--rule)}
.gauge .pin{
  position:absolute; top:5px; width:9px; height:15px; margin-left:-4.5px;
  border:1.5px solid var(--ink); background:var(--paper);
}
.gauge .pin.L{border-color:var(--blue); background:var(--blue)}
.gauge .pin.R{border-color:var(--red); background:var(--red)}
.gauge .pin.est{background:var(--paper)}
.gauge .val{
  position:absolute; top:0; right:0; font-family:var(--mono); font-size:11px; font-weight:700;
}
.gauge .val.L{color:var(--blue)} .gauge .val.R{color:var(--red)}
.gauge .ends{position:absolute; top:14px; left:0; right:0; display:flex; justify-content:space-between;
  font-family:var(--mono); font-size:9px; color:var(--ink-2); letter-spacing:.1em}
.pending{font-family:var(--mono); font-size:11px; color:var(--ink-2); margin-top:6px; font-style:italic}

/* --- putt rows ----------------------------------------------- */
.putt{border-bottom:1px solid var(--rule); padding:9px 12px; font-family:var(--mono); font-size:12.5px}
.putt:last-child{border-bottom:0}
.putt .p1{display:flex; gap:8px; align-items:baseline}
.putt .len{font-weight:700; font-size:15px; min-width:56px}
.putt .res{letter-spacing:.1em; text-transform:uppercase; font-size:11px}
.putt .res.made{color:var(--blue); font-weight:700}
.putt .errs{color:var(--red); font-size:10.5px; letter-spacing:.1em; text-transform:uppercase; margin-top:3px}
.putt .x{margin-left:auto; color:var(--ink-2); cursor:pointer; padding:0 6px}

/* --- setup grid ---------------------------------------------- */
.hgrid{display:grid; grid-template-columns:repeat(3,1fr); gap:6px}
.hcell{
  border:1px solid var(--rule); background:var(--paper); padding:8px 6px; cursor:pointer;
  font-family:var(--mono); text-align:left; border-radius:2px; min-height:60px;
}
.hcell .n{font-size:17px; font-weight:700}
.hcell .m{font-size:9.5px; color:var(--ink-2); letter-spacing:.1em; text-transform:uppercase}
.hcell .st{font-size:10px; margin-top:3px; letter-spacing:.16em}
.hcell.done{background:var(--turf); border-color:var(--ink)}
.hcell.done .st{color:var(--ink)}
.hcell .st.no{color:var(--red)}

/* --- footer nav ---------------------------------------------- */
.foot{
  position:fixed; left:0; right:0; bottom:0; background:var(--paper);
  border-top:3px solid var(--ink); padding:8px max(12px, env(safe-area-inset-left));
  padding-bottom:max(8px, env(safe-area-inset-bottom));
  display:flex; gap:8px; max-width:640px; margin:0 auto; z-index:20;
}
.foot .btn{margin:0}
.foot .btn.nar{flex:0 0 68px; text-align:center; padding:12px 4px}

/* --- toast --------------------------------------------------- */
#cts{position:fixed; inset:0; background:var(--paper); z-index:70; display:none; overflow-y:auto;
  padding:20px max(14px,env(safe-area-inset-left)) 28px}
#cts.on{display:block}
.ctswrap{max-width:520px; margin:0 auto}
.ctshead{font-family:var(--mono); font-size:11px; letter-spacing:.24em; text-transform:uppercase;
  color:var(--ink-2); border-bottom:3px solid var(--ink); padding-bottom:8px; margin-bottom:18px}
.ctsrow{display:grid; grid-template-columns:64px 1fr; gap:14px; align-items:start;
  border-bottom:1px solid var(--rule); padding:16px 0}
.ctsL{font-family:var(--mono); font-size:52px; font-weight:700; line-height:.8; color:var(--k)}
.ctsN{font-family:var(--mono); font-size:15px; font-weight:700; letter-spacing:.14em;
  text-transform:uppercase; color:var(--k); margin-bottom:8px}
.ctsI{font-size:16px; padding:3px 0 3px 14px; position:relative; color:var(--ink)}
.ctsI:before{content:''; position:absolute; left:0; top:12px; width:7px; height:1.5px; background:var(--k)}
#cts .btn{margin-top:20px}
#toast{
  position:fixed; left:50%; bottom:84px; transform:translateX(-50%);
  background:var(--ink); color:var(--paper); font-family:var(--mono); font-size:12px;
  padding:10px 16px; border-radius:2px; z-index:60; max-width:90%; text-align:center;
  opacity:0; pointer-events:none; transition:opacity .18s;
}
#toast.on{opacity:1}

/* --- gps capture overlay ------------------------------------- */
#gps{
  position:fixed; inset:0; background:rgba(22,24,26,.94); color:var(--paper);
  display:none; flex-direction:column; align-items:center; justify-content:center;
  z-index:80; font-family:var(--mono); text-align:center; padding:24px;
}
#gps.on{display:flex}
#gps .big{font-size:44px; font-weight:700; letter-spacing:-.02em}
#gps .cap{font-size:10px; letter-spacing:.24em; text-transform:uppercase; opacity:.6; margin-bottom:14px}
#gps .bar{width:180px; height:2px; background:rgba(255,255,255,.2); margin:18px 0; overflow:hidden}
#gps .bar i{display:block; height:100%; width:0; background:var(--paper)}
#gps button{margin-top:10px; background:transparent; border:1px solid rgba(255,255,255,.4); color:var(--paper);
  padding:12px 20px; font-family:var(--mono); font-size:12px; letter-spacing:.14em; text-transform:uppercase; border-radius:2px}
@media (prefers-reduced-motion: reduce){*{transition:none !important; animation:none !important}}

pre.csv{
  background:var(--paper-2); border:1px solid var(--rule); padding:10px; overflow:auto;
  font-family:var(--mono); font-size:10.5px; max-height:220px; white-space:pre; margin:0 0 8px;
}
</style>

<div class="mast">
  <h1>Centreline</h1>
  <div class="sub" id="mastsub"></div>
</div>

<div id="app"></div>
<div class="foot" id="foot"></div>
<div id="toast"></div>
<div id="cts">
  <div class="ctswrap">
    <div class="ctshead">Before the shot</div>
    <div class="ctsrow" style="--k:var(--blue)">
      <div class="ctsL">C</div>
      <div><div class="ctsN">Conditions</div>
        <div class="ctsI">Lie</div><div class="ctsI">Wind</div><div class="ctsI">Topography</div></div>
    </div>
    <div class="ctsrow" style="--k:var(--red)">
      <div class="ctsL">T</div>
      <div><div class="ctsN">Target</div>
        <div class="ctsI">Distance</div><div class="ctsI">Land and roll spot</div><div class="ctsI">Where to miss</div></div>
    </div>
    <div class="ctsrow" style="--k:var(--ink)">
      <div class="ctsL">S</div>
      <div><div class="ctsN">Swing</div>
        <div class="ctsI">Shot shape</div><div class="ctsI">Club</div><div class="ctsI">Swing feel</div></div>
    </div>
    <div class="row">
      <button class="btn solid" onclick="markRoutine(true)">Ran it</button>
      <button class="btn ghost" onclick="markRoutine(false)">Skipped</button>
    </div>
    <button class="btn ghost" onclick="S.routineAuto=false;save();closeCTS()">Stop showing this automatically</button>
  </div>
</div>
<div id="gps">
  <div class="cap">Acquiring position</div>
  <div class="big" id="gpsacc">--</div>
  <div class="cap" style="margin:6px 0 0">metres accuracy</div>
  <div class="bar"><i id="gpsbar"></i></div>
  <button id="gpsuse">Use now</button>
  <button id="gpscancel" style="border-color:rgba(255,255,255,.15)">Cancel</button>
</div>

<script>
/* ============================================================
   CONFIG — edit these two lists to match your bag
   ============================================================ */
/* Expected TOTAL distance in metres — carry plus roll, on grass. Edit in Bag. */
const DEFAULT_BAG = [
  {club:'Driver',  d:258}, {club:'Mini Dr', d:230}, {club:'3 Wood', d:215},
  {club:'Hyb 21',  d:200}, {club:'4 Iron',  d:183}, {club:'5 Iron', d:174},
  {club:'6 Iron',  d:163}, {club:'7 Iron',  d:153}, {club:'8 Iron', d:144},
  {club:'9 Iron',  d:134}, {club:'PW',      d:125}, {club:'GW',     d:113},
  {club:'56',      d:105}, {club:'60',      d:90},
];
const GAUGE_RANGE = 40; // metres each side shown on the deviation strip

/* Heidelberg GC — strategic lines, tee end to green centre, one row per hole.
   Drawn in Google Earth; [lat, lng] to six decimals (~0.1 m). */
const HEIDELBERG = [
  [[-37.731869,145.110467],[-37.731989,145.110461],[-37.732761,145.1104],[-37.733545,145.110244],[-37.733775,145.109994],[-37.734284,145.109782],[-37.734471,145.109632],[-37.734671,145.109629]],
  [[-37.733656,145.108425],[-37.733537,145.107752]],
  [[-37.733329,145.107201],[-37.733307,145.106647],[-37.73322,145.106219],[-37.733149,145.105721],[-37.733118,145.105164],[-37.733116,145.104589]],
  [[-37.7325,145.105897],[-37.732428,145.106511],[-37.73241,145.106836],[-37.732388,145.107421],[-37.732208,145.108208],[-37.732066,145.108703],[-37.732003,145.109135],[-37.732021,145.109541]],
  [[-37.730508,145.111057],[-37.730264,145.11134],[-37.72997,145.111581],[-37.729689,145.111832],[-37.729458,145.112074],[-37.729248,145.11228],[-37.729069,145.112504]],
  [[-37.728721,145.114032],[-37.728629,145.114591]],
  [[-37.729069,145.113942],[-37.729143,145.11347],[-37.729268,145.113225],[-37.729385,145.112979],[-37.729582,145.112734],[-37.729917,145.112629],[-37.730162,145.112367]],
  [[-37.729785,145.113412],[-37.729418,145.114399],[-37.729261,145.115136],[-37.729152,145.115815],[-37.729098,145.116014]],
  [[-37.7299,145.115568],[-37.730232,145.114938],[-37.730301,145.114311],[-37.730467,145.113696],[-37.730663,145.113183],[-37.73086,145.112256],[-37.730825,145.1116]],
  [[-37.731178,145.11194],[-37.731257,145.112782],[-37.731349,145.113309],[-37.731466,145.113449],[-37.731583,145.113523],[-37.73234,145.11412]],
  [[-37.731715,145.11482],[-37.731043,145.114961],[-37.730878,145.115098],[-37.730774,145.115311],[-37.730425,145.115709],[-37.730023,145.116072],[-37.729757,145.116358],[-37.729309,145.116867]],
  [[-37.730233,145.116833],[-37.73079,145.116422],[-37.731175,145.116067],[-37.731623,145.115698],[-37.732199,145.115327]],
  [[-37.731009,145.117038],[-37.730595,145.117398]],
  [[-37.731645,145.117109],[-37.731943,145.116589],[-37.732258,145.116232],[-37.732906,145.115869],[-37.733947,145.115316],[-37.73423,145.114965],[-37.734894,145.114462]],
  [[-37.734863,145.113177],[-37.734711,145.112475],[-37.7347,145.111717],[-37.734704,145.11111],[-37.73483,145.110629]],
  [[-37.734136,145.110957],[-37.733639,145.111338],[-37.733283,145.111449],[-37.732879,145.111427],[-37.732564,145.111342]],
  [[-37.733235,145.112295],[-37.73335,145.112469],[-37.733465,145.112577],[-37.733597,145.112646],[-37.733932,145.112571]],
  [[-37.732789,145.112769],[-37.732365,145.112392],[-37.731753,145.111709],[-37.731463,145.111336],[-37.731341,145.11102]],
];
/* Heidelberg GC scorecard, White tees — [par, stroke index, metres].
   5726 m, par 72 (36 out / 36 in). The card also carries a separate match index; this is
   the stroke index from the White card, which is what stableford uses. */
const HGC_CARD = [
  [4, 5,355],[3,14,143],[4, 4,369],[5, 7,442],[4,18,260],[3,17, 98],
  [4,10,311],[4, 1,352],[5,11,479],[4, 6,311],[5,12,432],[4, 9,345],
  [3,15,153],[5, 2,541],[4,13,362],[4, 8,297],[3,16,137],[4, 3,339],
];
/* Course management notes, indexed by hole. Blank where none written yet. */
const HGC_PLANS = [
  '',                                                                    // 1
  '',                                                                    // 2
  'Drive: 20 m past the tree on the left.',                              // 3
  'Drive: 60 m short of the tree on the left.\nApproach: land at or past the dark tree on the left, beyond the big tree.', // 4
  'Off the tee: distance to the big tree on the right, plus 20 m.',      // 5
  '',                                                                    // 6
  'Widest part of the fairway. Leaves 145 m in.',                        // 7
  'Try a hybrid here.',                                                  // 8
  '',                                                                    // 9
  'Leave 120 m in, from abeam the bunker.',                              // 10
  'Distance to the big tree on the left, plus 10 m.',                    // 11
  '30 m past the overhanging branch on the right.\nHole opens up to the right.', // 12
  'Long and right. 8 m past the right bunker lip.',                      // 13
  '30 m past the tree on the left.',                                     // 14
  'Hybrid, aiming just inside the left rough. Right of the cart path.',  // 15
  'Aim just inside the left rough.',                                     // 16
  '',                                                                    // 17
  'Aim just inside the left rough.',                                     // 18
];
const DEFAULT_TEES = ['White','Blue','Black'];
const seedCourse = (name,rows,card)=>({
  id:'heidelberg', name, tees:DEFAULT_TEES.slice(),
  holes: rows.map((pts,i)=>({
    n:i+1,
    par:  card?card[i][0]:4,
    si:   card?card[i][1]:i+1,
    cardM:card?card[i][2]:null, plan:HGC_PLANS[i]||'',
    path: pts.map(q=>({lat:q[0], lng:q[1], acc:null, src:'map', ts:0})) }))
});

/* ============================================================
   STORAGE — works in the Claude artifact sandbox (window.storage)
   and as a plain hosted page (localStorage).
   ============================================================ */
const Store = {
  async get(k){
    if (window.storage) { try{ const r = await window.storage.get(k); return r? JSON.parse(r.value):null; }catch(e){ return null; } }
    try{ const v = localStorage.getItem(k); return v? JSON.parse(v):null; }catch(e){ return null; }
  },
  async set(k,v){
    const s = JSON.stringify(v);
    if (window.storage) { try{ await window.storage.set(k,s); return true; }catch(e){} }
    try{ localStorage.setItem(k,s); return true; }catch(e){ return false; }
  }
};

/* ============================================================
   GEO
   ============================================================ */
const R = 6371000;
const rad = d => d*Math.PI/180;

function proj(p, o){ // equirectangular metres about origin o
  return { x: rad(p.lng-o.lng)*Math.cos(rad(o.lat))*R, y: rad(p.lat-o.lat)*R };
}
function dist(p1,p2){
  if(!p1||!p2) return null;
  const a = proj(p2,p1); return Math.hypot(a.x,a.y);
}
/* signed perpendicular offset of P from line A->B. +ve = LEFT of travel */
function offLine(P,A,B){
  if(!P||!A||!B) return null;
  const b = proj(B,A), p = proj(P,A);
  const L = Math.hypot(b.x,b.y); if(L<1) return null;
  return (b.x*p.y - b.y*p.x)/L;
}
/* miss vs an aim point G, measured along the line you played it from (S->G).
   returns {lat: +left/-right, lon: +long/-short} */
function offPoint(P,S,G){
  if(!P||!S||!G) return null;
  const d = proj(G,S), e = proj(P,G);
  const L = Math.hypot(d.x,d.y); if(L<1) return null;
  const ux=d.x/L, uy=d.y/L;
  return { lat: (ux*e.y - uy*e.x), lon: (ux*e.x + uy*e.y) };
}

/* nearest point on a polyline. off is signed, + = left of travel.
   station is distance along the path to the foot of that perpendicular. */
function onPath(P,path){
  if(!P||!path||path.length<2) return null;
  const o=path[0], pts=path.map(q=>proj(q,o)), p=proj(P,o);
  let best=null, cum=0;
  for(let i=0;i<pts.length-1;i++){
    const a=pts[i], b=pts[i+1], dx=b.x-a.x, dy=b.y-a.y, L2=dx*dx+dy*dy, L=Math.sqrt(L2);
    if(L<0.5) continue;
    const tc=Math.max(0,Math.min(1,((p.x-a.x)*dx+(p.y-a.y)*dy)/L2));
    const d=Math.hypot(p.x-(a.x+tc*dx), p.y-(a.y+tc*dy));
    const sgn=(dx*(p.y-a.y)-dy*(p.x-a.x))>=0 ? 1 : -1;
    if(!best || d<best.d) best={d, off:d*sgn, station:cum+tc*L, seg:i};
    cum+=L;
  }
  return best;
}
function stations(path){
  const out=[0]; if(!path||path.length<2) return out;
  const o=path[0], pts=path.map(q=>proj(q,o));
  let cum=0;
  for(let i=0;i<pts.length-1;i++){ cum+=Math.hypot(pts[i+1].x-pts[i].x, pts[i+1].y-pts[i].y); out.push(cum); }
  return out;
}
function unproj(x,y,o){
  return { lat:o.lat + (y/R)*180/Math.PI,
           lng:o.lng + (x/(R*Math.cos(rad(o.lat))))*180/Math.PI };
}
/* Walk the line forward from the ball and find where it is exactly D metres away.
   That point is what you were trying to reach with this club. */
function pointAtDistance(ball,path,D){
  const o=path[0], pts=path.map(q=>proj(q,o)), b=proj(ball,o);
  const here=onPath(ball,path), s0=here?here.station:0;
  let cum=0;
  for(let i=0;i<pts.length-1;i++){
    const a=pts[i], c=pts[i+1], dx=c.x-a.x, dy=c.y-a.y;
    const segL=Math.hypot(dx,dy);
    if(segL<0.5){ cum+=segL; continue; }
    const fx=a.x-b.x, fy=a.y-b.y;
    const A=dx*dx+dy*dy, B=2*(fx*dx+fy*dy), C=fx*fx+fy*fy-D*D;
    const disc=B*B-4*A*C;
    if(disc>=0){
      const sq=Math.sqrt(disc);
      const roots=[(-B-sq)/(2*A),(-B+sq)/(2*A)].filter(t=>t>=0&&t<=1).sort((x,y)=>x-y);
      for(const t of roots){
        if(cum + t*segL <= s0 + 1) continue;   // must be up-course of the ball
        return unproj(a.x+t*dx, a.y+t*dy, o);
      }
    }
    cum+=segL;
  }
  return null;
}

/* What were you aiming at?
   The point on your line that sits one club's distance away. If the club would carry
   past the end of the line, the target is the green. */
function aimFor(origin,path,clubDist){
  if(!path||path.length<2) return null;
  const last=path.length-1;
  if(clubDist>0){
    const p=pointAtDistance(origin,path,clubDist);
    if(p) return {pt:p, name:Math.round(clubDist)+'m'};
  }
  return {pt:path[last], name:'green'};
}

/* accept "-37.74001, 145.10002" in more or less any punctuation */
function parseLL(str){
  const n = String(str).match(/-?\d+\.\d{3,}/g);
  if(!n || n.length<2) return null;
  const lat=parseFloat(n[0]), lng=parseFloat(n[1]);
  if(!isFinite(lat)||!isFinite(lng)||Math.abs(lat)>90||Math.abs(lng)>180) return null;
  return {lat,lng,acc:null,src:'map',ts:Date.now()};
}
const ptLabel = p => !p ? 'not marked' : (p.src==='map' ? 'from map' : '\u00b1'+p.acc+' m GPS');

let GEO_WHY='';   // why the last fix failed, in plain words

function geoEnv(){
  return {
    proto: location.protocol,
    secure: !!window.isSecureContext,
    framed: window.top !== window.self,
    api: !!navigator.geolocation
  };
}
const NO_ORIGIN = ['content:','file:','blob:','data:'];
function geoReason(err){
  const e=geoEnv();
  if(!e.api)    return 'This browser has no geolocation API.';
  if(e.framed)  return 'Blocked inside a preview frame. Open the file in its own browser tab.';
  if(NO_ORIGIN.includes(e.proto)){
    return 'This page was opened as a local file ('+e.proto+'), so it has no web address. '+
           'Browsers never give location to those, and it will not appear in your site settings. '+
           'It has to be served from an https:// address.';
  }
  if(err && err.code===1){
    return e.proto==='file:'
      ? 'Denied. Pages opened straight from disk (file://) are not granted location by most browsers — it needs to be served over https.'
      : 'Permission denied. Allow location for this site in your browser settings.';
  }
  if(err && err.code===2) return 'Position unavailable. No signal, or the device has no GPS — a desktop with no wifi lookup will fail here.';
  if(err && err.code===3) return 'Timed out before any fix arrived.';
  return 'No fix arrived within 6 seconds.';
}

/* best-of-N GPS fix over ~6s, keep the tightest accuracy */
function capture(){
  return new Promise(resolve=>{
    GEO_WHY='';
    if(!navigator.geolocation){ GEO_WHY=geoReason(null); resolve(null); return; }
    const ov=document.getElementById('gps'), accEl=document.getElementById('gpsacc'), bar=document.getElementById('gpsbar');
    ov.classList.add('on'); let best=null, done=false, t0=Date.now();
    const finish = ()=>{ if(done) return; done=true; navigator.geolocation.clearWatch(id); clearInterval(tick); ov.classList.remove('on'); resolve(best); };
    const id = navigator.geolocation.watchPosition(p=>{
      const f={lat:p.coords.latitude,lng:p.coords.longitude,acc:Math.round(p.coords.accuracy),ts:Date.now()};
      if(!best || f.acc<best.acc){ best=f; accEl.textContent=f.acc; }
      if(f.acc<=4) finish();
    }, e=>{ accEl.textContent='\u2014'; GEO_WHY=geoReason(e);
            if(!best) finish(); }, {enableHighAccuracy:true, timeout:15000, maximumAge:0});
    const tick=setInterval(()=>{ const pc=Math.min(100,(Date.now()-t0)/6000*100); bar.style.width=pc+'%';
      if(pc>=100){ if(!best && !GEO_WHY) GEO_WHY=geoReason(null); finish(); } },100);
    document.getElementById('gpsuse').onclick=finish;
    document.getElementById('gpscancel').onclick=()=>{ best=null; finish(); };
  });
}

/* older saves stored a / b / green as three fixed points */
function migrate(h){
  if(!h.path){ h.path=[h.a,h.b,h.green].filter(Boolean); delete h.a; delete h.b; delete h.green; }
  if(h.plan===undefined) h.plan='';
  if(h.cardM===undefined) h.cardM=null;
  return h;
}
/* Shots received on a hole: one to every index at or under your handicap,
   plus another lap for anything over 18. */
function received(si,hcp){
  if(!hcp||hcp<=0) return 0;
  return Math.floor(hcp/18) + (si <= hcp%18 ? 1 : 0);
}
/* Stableford: two points for a nett par. */
function points(gross,par,si,hcp){
  if(!gross) return 0;
  return Math.max(0, par + received(si,hcp) + 2 - gross);
}

async function load(){
  S.courses = await Store.get('cl:courses') || {};
  let filled=0;
  Object.values(S.courses).forEach(c=>{
    if(!Array.isArray(c.tees) || !c.tees.length) c.tees=DEFAULT_TEES.slice();
    c.holes.forEach(migrate);
    /* An empty Heidelberg from before the built-in data existed — fill it in. */
    if(/heidelberg/i.test(c.name||'') && c.holes.every(h=>!h.path || h.path.length<2)){
      applyHeidelberg(c); filled++;
    }
  });
  if(filled){ await save(); setTimeout(()=>toast('Heidelberg lines, card and plans loaded'),600); }
  S.round   = await Store.get('cl:round')   || null;
  if(S.round) S.round.holes.forEach(migrate);
  (await Store.get('cl:archive')||[]).forEach(r=>r.holes.forEach(migrate));
  S.archive = await Store.get('cl:archive') || [];
  S.tee     = await Store.get('cl:tee')     || '';
  S.bag     = await Store.get('cl:bag')     || DEFAULT_BAG.map(c=>({...c}));
  const hc  = await Store.get('cl:hcp'); S.hcp = (hc===null||hc===undefined)?13:hc;
  const ra  = await Store.get('cl:routine'); S.routineAuto = (ra===null||ra===undefined)?true:ra;
  if(!Object.keys(S.courses).length){
    const c=seedCourse('Heidelberg GC', HEIDELBERG, HGC_CARD);
    S.courses[c.id]=c;
    await save();
  }
}

   ROUND HELPERS
   ============================================================ */
const CH = ()=> S.round.holes[S.hi];
const holeScore = h => h.shots.length + h.putts.length + h.penalties;

/* landing point of shot i = position of the next recorded ball location */
function landingOf(h,i){
  for(let j=i+1;j<h.shots.length;j++) if(h.shots[j].pos) return h.shots[j].pos;
  return h.greenPos || null;
}
function shotDev(h,i){
  const s=h.shots[i]; if(!s) return null;
  const L=landingOf(h,i);
  const out={run:null, off:null, aimLat:null, aimLon:null, aimName:'', src:null};
  if(s.estLat!==null && s.estLat!==undefined){ out.aimLat=s.estLat; out.src='est'; }
  if(!s.pos || !L) return (out.src||out.off!==null) ? out : null;
  out.run = dist(s.pos,L);
  const path=h.path;
  if(path && path.length>=2){
    const nr=onPath(L,path); if(nr) out.off=nr.off;
    if(s.target!=='off'){
      const a=aimFor(s.pos,path,clubDist(s.club));
      if(a){ const o=offPoint(L,s.pos,a.pt);
        if(o){ out.aimLat=o.lat; out.aimLon=o.lon; out.aimName=a.name; out.src='gps'; } }
    }
  }
  if(!out.src && (s.estLat!==null&&s.estLat!==undefined)) out.src='est';
  return out;
}

/* ---------- plan view: the hole line, your ball positions, drawn to scale ---------- */
function svgHole(h){
  const path=h.path;
  if(!path || path.length<2) return '<div class="block note">No line drawn for this hole.</div>';
  const o=path[0];
  const balls=h.shots.filter(x=>x.pos).map(x=>x.pos).concat(h.greenPos?[h.greenPos]:[]);
  const E=proj(path[path.length-1],o), Lm=Math.hypot(E.x,E.y);
  if(Lm<5) return '<div class="block note">Line too short to draw.</div>';
  const cb=E.y/Lm, sb=E.x/Lm;                    // cos/sin of the line's bearing
  const rot=q=>{ const m=proj(q,o); return {x:m.x*cb - m.y*sb, y:m.x*sb + m.y*cb}; };
  const P=path.map(rot), B=balls.map(rot);
  const all=P.concat(B);
  let x0=Math.min(...all.map(p=>p.x)), x1=Math.max(...all.map(p=>p.x));
  let y0=Math.min(...all.map(p=>p.y)), y1=Math.max(...all.map(p=>p.y));
  const padM=15; x0-=padM; x1+=padM; y0-=padM; y1+=padM;
  if(x1-x0 < 60){ const c=(x0+x1)/2; x0=c-30; x1=c+30; }
  const wM=x1-x0, hM=y1-y0;
  const MAXW=280, MAXH=400, LBL=30;                    // LBL leaves room for tick labels
  const sc=Math.min(MAXW/wM, MAXH/hM);
  const W=wM*sc, H=hM*sc, VW=W+LBL, VH=H+16;
  const sx=p=>((p.x-x0)*sc).toFixed(1), sy=p=>(H-(p.y-y0)*sc).toFixed(1);
  const line=P.map(p=>sx(p)+','+sy(p)).join(' ');
  const gp=P[P.length-1];

  /* 50 m ticks along the line */
  const st=stations(path); let ticks='';
  for(let d=50; d<st[st.length-1]; d+=50){
    let seg=0; while(seg<st.length-2 && st[seg+1]<d) seg++;
    const f=(d-st[seg])/(st[seg+1]-st[seg]);
    const tx=P[seg].x+f*(P[seg+1].x-P[seg].x), ty=P[seg].y+f*(P[seg+1].y-P[seg].y);
    const X=((tx-x0)*sc).toFixed(1), Y=(H-(ty-y0)*sc).toFixed(1);
    ticks+=`<line x1="${X-5}" y1="${Y}" x2="${+X+5}" y2="${Y}" stroke="var(--rule)" stroke-width="1"/>
            <text x="${+X+9}" y="${+Y+3}" font-size="8" fill="var(--ink-2)" font-family="monospace">${d}</text>`;
  }
  let walk='', dots='';
  B.forEach((p,i)=>{
    if(i) walk+=`<line x1="${sx(B[i-1])}" y1="${sy(B[i-1])}" x2="${sx(p)}" y2="${sy(p)}"
                   stroke="var(--red)" stroke-width="1.2" stroke-dasharray="3 3"/>`;
    const onGreen = h.greenPos && i===B.length-1;
    dots+=`<circle cx="${sx(p)}" cy="${sy(p)}" r="${onGreen?5:4}" fill="${onGreen?'var(--red)':'var(--paper)'}"
             stroke="var(--red)" stroke-width="1.5"/>
           <text x="${(+sx(p)+(onGreen?-14:8)).toFixed(1)}" y="${(+sy(p)+3).toFixed(1)}" font-size="9"
             font-family="monospace" fill="var(--ink)">${onGreen?'G':(i+1)}</text>`;
  });
  const bar=50*sc;
  return `<svg viewBox="0 0 ${VW.toFixed(1)} ${VH.toFixed(1)}" width="${VW.toFixed(0)}" height="${VH.toFixed(0)}"
    style="max-width:100%;height:auto;display:block;margin:0 auto">
    <polyline points="${line}" fill="none" stroke="var(--ink)" stroke-width="2"/>
    ${P.slice(1,-1).map(p=>`<rect x="${+sx(p)-2.5}" y="${+sy(p)-2.5}" width="5" height="5" fill="var(--ink)"/>`).join('')}
    ${ticks}
    <circle cx="${sx(gp)}" cy="${sy(gp)}" r="9" fill="none" stroke="var(--ink)" stroke-width="1.5"/>
    <circle cx="${sx(gp)}" cy="${sy(gp)}" r="2" fill="var(--ink)"/>
    ${walk}${dots}
    <line x1="6" y1="${H+8}" x2="${(6+bar).toFixed(1)}" y2="${H+8}" stroke="var(--ink-2)" stroke-width="1.5"/>
    <text x="${(10+bar).toFixed(1)}" y="${H+11}" font-size="8" fill="var(--ink-2)" font-family="monospace">50 m</text>
  </svg>`;
}

    </div>`;
  }).join('') || `<div class="shot"><div class="pending">No shots logged.</div></div>`;

  /* putts */
  const putts = h.putts.map((p,i)=>{

        ${h.shots.length} shots &middot; ${h.putts.length} putts${h.penalties?' &middot; '+h.penalties+' pen':''}${h.sand?' &middot; '+h.sand+' sand':''}</div>
      <div class="holescore"><div class="k">Score</div><div class="n">${sc||'—'}</div>

    <button class="btn ghost" onclick="openCTS()">Show C&middot;T&middot;S</button>

    <label class="lbl">Bunker shots played</label>

    <button class="btn nar" onclick="go('home')">&equiv;</button>

function toGreen(h){
  if(!h.path||h.path.length<2) return '';
  const balls=h.shots.filter(x=>x.pos);
  const from = h.greenPos || (balls.length?balls[balls.length-1].pos:null);
  if(!from) return 'green at the ring';
  const d=dist(from, h.path[h.path.length-1]);
  return d==null?'':Math.round(d)+' m to green centre';
}

async function setTees(v){
  const list=v.split(',').map(x=>x.trim()).filter(Boolean);
  S.courses[S.cid].tees = list.length?list:DEFAULT_TEES.slice();
  await save(); render();
}
async function c_name(v){ S.courses[S.cid].name=v; await save(); }
async function delCourse(){ if(!confirm('Delete this course and its marked lines?')) return;
  delete S.courses[S.cid]; S.cid=null; await save(); go('courses'); }
function openHole(i){ S.hsetup=i; go('hole'); }
function navSetup(d){ S.hsetup=Math.max(0,Math.min(17,S.hsetup+d)); render(); window.scrollTo(0,0); }
async function hset(k,d){ const h=S.courses[S.cid].holes[S.hsetup];
  h[k]=Math.max(1,Math.min(k==='par'?6:18,h[k]+d)); await save(); render(); }
async function markPt(k){ const p=await capture(); if(!p){ toast(GEO_WHY||'No fix'); return; }
  S.courses[S.cid].holes[S.hsetup][k]=p; await save(); render(); }

async function importGeo(txt){
  if(!txt||!txt.trim()){ toast('Paste something first'); return; }
  const c=S.courses[S.cid]; let holesSet=0; const bad=[];
  const mk=(lat,lng)=>({lat,lng,acc:null,src:'map',ts:Date.now()});
  const ok=(lat,lng)=>isFinite(lat)&&isFinite(lng)&&Math.abs(lat)<=90&&Math.abs(lng)<=180;

  if(/<coordinates/i.test(txt)){
    const doc=new DOMParser().parseFromString(txt,'text/xml');
    doc.querySelectorAll('Placemark').forEach(pm=>{
      const nm=(pm.querySelector('name')?.textContent||'').trim();
      const hm=nm.match(/\d{1,2}/);
      const raw=(pm.querySelector('coordinates')?.textContent||'').trim();
      if(!hm || !raw){ bad.push(nm||'(unnamed)'); return; }
      const hole=+hm[0];
      if(!(hole>=1&&hole<=18)){ bad.push(nm); return; }
      const pts=raw.split(/\s+/).filter(Boolean).map(t=>t.split(',')) 
        .filter(t=>t.length>=2 && ok(parseFloat(t[1]),parseFloat(t[0])))
        .map(t=>mk(parseFloat(t[1]),parseFloat(t[0])));
      if(!pts.length){ bad.push(nm); return; }
      if(pts.length>1){ c.holes[hole-1].path=pts; holesSet++; }
      else c.holes[hole-1].path.push(pts[0]);
    });
  } else {
    const byHole={};
    txt.split(/\r?\n/).forEach(line=>{
      if(!line.trim()) return;
      const t=line.split(/[\s,;]+/).filter(Boolean);
      const hole=parseInt(t[0],10);
      const seq = /^(C1|A)$/i.test(t[1]) ? 1 : /^(C2|B)$/i.test(t[1]) ? 2
                : /^(G|GREEN)$/i.test(t[1]) ? 99 : parseInt(t[1],10);
      const lat=parseFloat(t[2]), lng=parseFloat(t[3]);
      if(!(t.length>=4 && hole>=1 && hole<=18 && isFinite(seq) && ok(lat,lng))){ bad.push(line.trim()); return; }
      (byHole[hole]=byHole[hole]||[]).push({seq, p:mk(lat,lng)});
    });
    Object.entries(byHole).forEach(([hole,list])=>{
      list.sort((x,y)=>x.seq-y.seq);
      c.holes[hole-1].path=list.map(x=>x.p); holesSet++;
    });
  }
  await save(); render();
  toast(holesSet+' hole line(s) imported'+(bad.length?', '+bad.length+' skipped':''));
  if(bad.length) console.warn('Centreline skipped:', bad);
}
function applyHeidelberg(c){
  const src=seedCourse('x',HEIDELBERG,HGC_CARD);
  c.holes.forEach((h,i)=>{
    const t=src.holes[i];
    h.path=t.path; h.par=t.par; h.si=t.si; h.cardM=t.cardM; h.plan=t.plan;
  });
  if(!c.tees || !c.tees.length) c.tees=DEFAULT_TEES.slice();
  return c;
}
async function loadHeidelberg(){
  if(!confirm('Replace the lines, card and plans on this course with the built-in Heidelberg data?')) return;
  applyHeidelberg(S.courses[S.cid]);
  await save(); render(); toast('Heidelberg loaded — 18 lines, par 72, 13 plans');
}
async function loadPlans(){
  const c=S.courses[S.cid];
  const has=c.holes.filter(h=>h.plan).length;
  if(has && !confirm('Overwrite the '+has+' plan(s) already written on this course?')) return;
  c.holes.forEach((h,i)=>{ h.plan=HGC_PLANS[i]||''; });
  await save(); render(); toast(HGC_PLANS.filter(Boolean).length+' plans loaded');
}
async function loadCard(){
  if(!confirm('Overwrite par and stroke index on all 18 holes with the Heidelberg card?')) return;
  const c=S.courses[S.cid];
  c.holes.forEach((h,i)=>{ h.par=HGC_CARD[i][0]; h.si=HGC_CARD[i][1]; h.cardM=HGC_CARD[i][2]; });
  await save(); render(); toast('Card loaded — par 72, 5726 m');
}
async function loadBuiltIn(){
  if(!confirm('Replace every line in this course with the built-in Heidelberg lines?')) return;
  const c=S.courses[S.cid];
  const src2=seedCourse('x',HEIDELBERG,HGC_CARD);
  c.holes.forEach((h,i)=>{ h.path=src2.holes[i].path; });
  await save(); render(); toast('18 lines restored');
}
function dumpGeo(){
  const c=S.courses[S.cid], out=[];
  c.holes.forEach(h=>h.path.forEach((v,i)=>
    out.push(h.n+' '+(i+1)+' '+v.lat.toFixed(6)+' '+v.lng.toFixed(6))));
  navigator.clipboard.writeText(out.join('\n')).then(()=>toast(out.length+' points copied'),
    ()=>toast('Copy blocked by the browser'));
}

/* ============================================================
   EXPORT
   ============================================================ */
function q(v){ if(v===null||v===undefined) return ''; const s=String(v);
  return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s; }
function toCSV(rows){ return rows.map(r=>r.map(q).join(',')).join('\n'); }

function buildCSVs(rounds){
  const shots=[['date','course','tee','hole','par','si','shot','club','plan','lat','lng','gps_acc_m',
    'land_lat','land_lng','land_acc_m','shot_run_m',
    'aim_target','aim_side_m','aim_side','aim_long_m','aim_src','off_line_m','off_line_side','routine']];
  const putts=[['date','course','tee','hole','putt','length_m','level','distance','line',
    'err_prep','err_read','err_speed','err_stroke','err_mental','note']];
  const holes=[['date','course','tee','hcp','hole','par','si','card_m','shots_received',
    'shots','putts','penalties','sand','score','to_par','nett','stableford','gir',
    'first_putt_m','plan','note']];

  rounds.forEach(r=>r.holes.forEach(h=>{
    if(!h.shots.length && !h.putts.length) return;
    h.shots.forEach((s,i)=>{
      const L=landingOf(h,i), d=shotDev(h,i);
      shots.push([r.date,r.courseName,r.tee||'',h.n,h.par,h.si,i+1,s.club,s.target,
        s.pos?s.pos.lat.toFixed(7):'', s.pos?s.pos.lng.toFixed(7):'', s.pos?s.pos.acc:'',
        L?L.lat.toFixed(7):'', L?L.lng.toFixed(7):'', L?L.acc:'',
        d&&d.run!=null?d.run.toFixed(1):'',
        d?d.aimName:'',
        d&&d.aimLat!=null?Math.abs(d.aimLat).toFixed(1):'',
        d&&d.aimLat!=null?(d.aimLat>0?'left':'right'):'',
        d&&d.aimLon!=null?d.aimLon.toFixed(1):'',
        d&&d.aimLat!=null?d.src:'',
        d&&d.off!=null?Math.abs(d.off).toFixed(1):'',
        d&&d.off!=null?(d.off>0?'left':'right'):'',
        s.prep===true?1:(s.prep===false?0:'')]);
    });
    h.putts.forEach((p,i)=>putts.push([r.date,r.courseName,r.tee||'',h.n,i+1,p.len,p.level,p.dist,p.line,
      p.prep?1:'',p.read||'',p.speed||'',p.stroke||'',p.mental?1:'',p.note||'']));
    const sc=holeScore(h);
    const hcp=r.hcp===undefined?'':r.hcp, rx=hcp===''?'':received(h.si,hcp);
    holes.push([r.date,r.courseName,r.tee||'',hcp,h.n,h.par,h.si,h.cardM||'',rx,
      h.shots.length,h.putts.length,h.penalties,h.sand,
      sc, sc-h.par, hcp===''?'':sc-rx, hcp===''?'':points(sc,h.par,h.si,hcp),
      (h.shots.length<=h.par-2 && h.penalties===0)?1:0,
      h.putts.length?h.putts[0].len:'', h.plan||'', h.note||'']);
  }));
  return {shots:toCSV(shots), putts:toCSV(putts), holes:toCSV(holes)};
}

function vExport(app,foot){
  const rounds = S.archive.concat(S.round?[S.round]:[]);
  if(!rounds.length){
    app.innerHTML=`<div class="eyebrow"><b>Export</b></div>
      <div class="block note">Nothing logged yet. Play a hole and the CSVs appear here.</div>`;
    foot.innerHTML=`<button class="btn nar" onclick="go('home')">&larr;</button>`; return;
  }
  const c=buildCSVs(rounds);
  const blk=(k,label,csv)=>`
    <div class="eyebrow"><b>${label}</b><span class="fill">${csv.split('\n').length-1} rows</span></div>
    <pre class="csv" id="csv_${k}">${esc(csv)}</pre>
    <div class="row">
      <button class="btn ghost" onclick="copyCSV('${k}')">Copy</button>
      <button class="btn ghost" onclick="dl('${k}')">Download</button>
    </div>`;
  window._csv=c;
  app.innerHTML = `<div class="eyebrow"><b>Export</b><span class="fill">${rounds.length} round(s)</span></div>`
    + blk('shots','Shots &amp; dispersion',c.shots)
    + blk('putts','Putts',c.putts)
    + blk('holes','Holes',c.holes)
    + `<div class="eyebrow"><b>Reading the numbers</b></div>
       <div class="block note">
       <b>aim_side_m / aim_side</b> — how far the ball finished off the line you played it on,
       measured from where you struck it to the next point up the hole's line. This is the number that
       compares to launch-monitor side dispersion.<br><br>
       <b>aim_long_m</b> — same shot, along the aim line. Positive is past the target.<br><br>
       <b>aim_target</b> — the point on the hole's line one club-distance from your ball, which is
       what the aim columns are measured against. <b>green</b> means the club would have finished past
       the end of the line, so the green itself was used. Recoveries and anything you did not aim down
       the line should be tagged <b>off plan</b> as you play them; the aim columns then stay empty
       rather than lying.<br><br>
       <b>aim_src</b> — <b>gps</b> if measured, <b>est</b> if you typed it. Filter before calculating
       any dispersion figure.<br><br>
       <b>off_line_m / off_line_side</b> — shortest distance from the ball to the hole's line,
       wherever it runs. This is the course-management number: how far from the middle you finished.
       Independent of what you aimed at, so it is still valid on recoveries.<br><br>
       <b>shot_run_m</b> — straight-line distance between consecutive ball positions. Carry plus roll,
       not carry.<br><br>
       <b>stableford</b> — par plus shots received plus two, minus gross, floored at zero. Two points
       is a nett par. This is the column to sort by when you go looking for the holes that cost you a
       round.<br><br>
       <b>routine</b> — 1 if you ticked <b>Ran the routine</b> before logging that shot. Worth
       grouping by once you have a few rounds: if the shots where you worked through conditions,
       target and swing are not measurably straighter, the routine is not the thing costing you
       strokes and you should look elsewhere.<br><br>
       <b>gir</b> — derived as shots-to-green &le; par&minus;2 with no penalty.
       </div>`;
  foot.innerHTML=`<button class="btn nar" onclick="go('home')">&larr;</button>`;
}
function copyCSV(k){ navigator.clipboard.writeText(window._csv[k]).then(()=>toast('Copied '+k+' CSV'),()=>toast('Copy blocked — select the text instead')); }
function dl(k){
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([window._csv[k]],{type:'text/csv'}));
  a.download='centreline-'+k+'-'+new Date().toISOString().slice(0,10)+'.csv';
  a.click(); URL.revokeObjectURL(a.href);
}

S.tgt='on'; S.pick=null;
load().then(render);
